<style>
/* Layout: rink-board slate. Summary scoreboard first, then one sheet per game. */
:root {
  --ice: #f3f6f9;        /* page */
  --board: #ffffff;      /* surfaces */
  --ink: #12202f;        /* text */
  --muted: #5d6b7a;
  --line: #d8e0e8;
  --blue: #1d5fbf;       /* blue line: model */
  --red: #c8322b;        /* goal light: market */
  --good: #1f8a4c;
  --warn: #b36b00;
  --chip: #e8eef5;
  --pick: #8a5200;       /* tracked pick */
  --pick-bg: #fdf1dc;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ice: #0c141d; --board: #131e2a; --ink: #e6edf4; --muted: #92a1b1; --line: #253445;
  --blue: #6aa5ff; --red: #ff6b5f; --good: #4cc47e; --warn: #f0a83a; --chip: #1c2a3a; --pick: #f5c460; --pick-bg: #33280f; color-scheme: dark } }
:root[data-theme="dark"] {
  --ice: #0c141d; --board: #131e2a; --ink: #e6edf4; --muted: #92a1b1; --line: #253445;
  --blue: #6aa5ff; --red: #ff6b5f; --good: #4cc47e; --warn: #f0a83a; --chip: #1c2a3a; --pick: #f5c460; --pick-bg: #33280f; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--ice); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45 }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 22px }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance }
h1 { font-size: 2.1rem; line-height: 1 }
h2 { font-size: 1.35rem; text-transform: uppercase; letter-spacing: .04em }
h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-family: var(--f-body); font-weight: 600 }
.num { font-variant-numeric: tabular-nums }
.mono { font-family: var(--f-mono); font-size: .86em }
.muted { color: var(--muted) }
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px }
.top .sub { color: var(--muted); margin-top: 6px }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: .85rem }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px }
.note { background: var(--board); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 6px; padding: 10px 14px; color: var(--ink) }
.record { display: flex; flex-wrap: wrap; gap: 10px 28px }
.record div b { font-family: var(--f-display); font-size: 1.5rem; display: block; line-height: 1.1 }

/* Scoreboard summary */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch }
table { border-collapse: collapse; width: 100% }
.sb { background: var(--board); border: 1px solid var(--line); border-radius: 8px }
.sb table { min-width: 720px }
.sb th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap }
.sb td { padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle }
.sb tr:last-child td { border-bottom: 0 }
.sb td.pk { white-space: normal; min-width: 230px; line-height: 1.9 }
.sb tr.go { cursor: pointer }
.sb tr.go:hover td, .sb tr.go:focus-visible td { background: var(--chip) }
.sb tr.go:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px }
.match { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600 }
.pick { font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; color: var(--blue) }
.pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); letter-spacing: .02em }
.pill.pos { color: var(--good) } .pill.neg { color: var(--muted) } .pill.live { color: var(--red) }
.pill.conf { color: var(--good) } .pill.likely { color: var(--warn) } .pill.guess { color: var(--red) }

/* Game sheets */
.games { display: grid; gap: 18px }
.game { background: var(--board); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; scroll-margin-top: 12px }
.ghead { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 16px 18px 6px }
.team { min-width: 0 }
.team .ab { font-family: var(--f-display); font-size: 2.4rem; font-weight: 700; line-height: .95 }
.team .nm { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.team.home { text-align: right }
.mid { text-align: center; display: grid; gap: 2px }
.mid .proj { font-family: var(--f-display); font-size: 2.2rem; font-weight: 700; line-height: 1 }
.mid .lab { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted) }
.bar { margin: 8px 18px 4px; display: grid; gap: 6px }
.bar .row { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 8px; font-size: .8rem }
.bar .row span:last-child { text-align: right }
.track { height: 12px; background: var(--chip); border-radius: 3px; position: relative; overflow: hidden }
.track .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px 0 0 3px }
.track .mid50 { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--muted); opacity: .5 }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 8px 18px 14px; color: var(--muted); font-size: .85rem }
.facts b { color: var(--ink); font-weight: 600 }
.body { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0; border-top: 1px solid var(--line) }
.panel { padding: 14px 18px; display: grid; gap: 10px; align-content: start; min-width: 0; border-bottom: 1px solid var(--line) }
.kv { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; font-size: .88rem }
.kv .h { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em }
.kv span:nth-child(3n+2), .kv span:nth-child(3n) { text-align: right; font-variant-numeric: tabular-nums }
.bets td, .bets th, .odds td, .odds th { padding: 5px 6px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; border-bottom: 1px solid var(--line) }
.bets th, .odds th { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600 }
.bets td:first-child, .bets th:first-child, .odds td:first-child, .odds th:first-child { text-align: left }
.odds .best { color: var(--good); font-weight: 600 }
@media (min-width: 900px) { .panel.wide { grid-column: span 2 } }
.wu { padding: 4px 18px 12px; display: grid; gap: 4px; max-width: 80ch }
.wu p { margin: 0; line-height: 1.5 }
.wu .wu-pick { font-weight: 600; color: var(--ink); background: var(--pick-bg); border-left: 3px solid var(--pick); padding: 4px 8px; border-radius: 0 4px 4px 0 }
.wu .wu-none { color: var(--muted) }
.bets .bk { font-size: .72rem; color: var(--muted) }
.bets td { vertical-align: top }
.ev-pos { color: var(--good); font-weight: 600 } .ev-neg { color: var(--muted) }
.drv { display: grid; gap: 4px; font-size: .86rem }
.drv div { display: flex; justify-content: space-between; gap: 10px }
.drv b { font-variant-numeric: tabular-nums }
.scores { display: flex; flex-wrap: wrap; gap: 6px }
.scores span { background: var(--chip); border-radius: 4px; padding: 3px 8px; font-variant-numeric: tabular-nums; font-size: .85rem }
.scores span b { font-family: var(--f-display); font-size: 1rem; margin-right: 6px }
.ctx { display: grid; grid-template-columns: auto 1fr 1fr; gap: 4px 12px; font-size: .86rem }
.ctx .h { font-weight: 600; font-family: var(--f-display); font-size: 1rem }
.ctx > span:nth-child(3n+1) { color: var(--muted) }
.unused { font-size: .78rem; color: var(--muted) }
details summary { cursor: pointer; color: var(--blue); font-weight: 500; padding: 10px 18px }
details summary:focus-visible { outline: 2px solid var(--blue) }
details[open] summary { border-bottom: 1px solid var(--line) }
.method { background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; max-width: 100% }
.method p { margin: 0; max-width: 72ch }
.method table td, .method table th { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.method table td:first-child, .method table th:first-child { text-align: left }
.pill.flag { background: var(--pick-bg); color: var(--pick); border: 1px solid var(--pick) }
.bets tr.flagged td { background: var(--pick-bg) }
.pill.dark { background: var(--chip); color: var(--blue); border: 1px solid var(--blue) }
.picks.darkhorse h2 { color: var(--blue) }
.picks.heavyfav h2 { color: var(--good) }
.pill.heavy { background: var(--chip); color: var(--good); border: 1px solid var(--good) }
.game.has-pick { border-color: var(--pick); box-shadow: inset 4px 0 0 var(--pick) }
.picks { background: var(--board); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 14px; min-width: 0 }
.picks .tiles { display: flex; flex-wrap: wrap; gap: 10px 32px; align-items: end }
.picks .tiles div b { font-family: var(--f-display); font-size: 1.7rem; display: block; line-height: 1.05 }
.picks .tiles .up { color: var(--good) } .picks .tiles .down { color: var(--red) }
.picks table td, .picks table th { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums }
.picks table th { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600 }
.picks table td:nth-child(-n+2), .picks table th:nth-child(-n+2) { text-align: left }
.res-won { color: var(--good); font-weight: 600 } .res-lost { color: var(--red); font-weight: 600 } .res-push { color: var(--muted) }
.curve { width: 100%; max-width: 520px; height: 70px; display: block }
.empty { background: var(--board); border: 1px dashed var(--line); border-radius: 8px; padding: 28px; text-align: center; color: var(--muted) }
@media (max-width: 560px) {
  .team .ab { font-size: 1.9rem } .mid .proj { font-size: 1.7rem }
  .ghead { padding: 14px 14px 4px } .bar { margin: 8px 14px 4px } .facts, .panel { padding-left: 14px; padding-right: 14px }
}
@media (prefers-reduced-motion: no-preference) { .track .fill { transition: width .4s ease } }
</style>

    return `<span class="pill ${cls}">${esc(s || 'Unknown')}</span>`; };
  const G = DATA.games || [];
  const TCLS = { main: 'flag', heavyfav: 'heavy', darkhorse: 'dark' };

  const gen = new Date(DATA.generated);

  let h = '';
  h += `<header class="top"><div><h1>NHL Edge · ${day.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' })}</h1>
    <div class="sub">${G.length} game${G.length === 1 ? '' : 's'} · updated ${gen.toLocaleString([], { hour: 'numeric', minute: '2-digit', month: 'short', day: 'numeric' })} · shot data through ${esc(DATA.history_through)}${DATA.odds_meta && DATA.odds_meta.remaining ? ' · Odds API credits left ' + esc(DATA.odds_meta.remaining) : ''}</div></div>
    <div class="legend"><span><i style="background:var(--blue)"></i>Model</span><span><i style="background:var(--red)"></i>Market (no-vig consensus)</span></div></header>`;

  h += `<div class="note">The model trailed the closing market in a 5-season backtest (log-loss ${DATA.backtest?.FINAL ? DATA.backtest.FINAL.ml.toFixed(4) : '–'} vs ${DATA.backtest?.FINAL ? DATA.backtest.FINAL.ml_mkt.toFixed(4) : '–'}). Read it as a second opinion next to the market. A positive EV column means the model disagrees with that price, not that the bet is good.</div>`;

  {
    const TT = (DATA.picks || {}).tiers || {};
    const cell = (lab, A, color) => {
      const rec = A ? `${A.w}-${A.l}${A.p ? '-' + A.p : ''}` : '0-0';

    };
    const parts = [['Tracked', (TT.main || {}).all, 'var(--pick)'], ['Heavy fav', (TT.heavyfav || {}).all, 'var(--good)'], ['Darkhorse', (TT.darkhorse || {}).all, 'var(--blue)']];
    const tot = parts.reduce((s, [, A]) => A ? { w: s.w + A.w, l: s.l + A.l, p: s.p + A.p, units: s.units + A.units } : s, { w: 0, l: 0, p: 0, units: 0 });
    tot.roi = tot.w + tot.l ? tot.units / (tot.w + tot.l) : null;
    h += `<section class="record scoreboard">${parts.map(([l, A, c]) => cell(l, A, c)).join('')}${cell('All picks', tot.w + tot.l + tot.p ? tot : null, 'var(--muted)')}${cell('Late', ((DATA.picks || {}).late || {}).all, 'var(--muted)')}${cell('Parlays', (DATA.parlay || {}).all, 'var(--red)')}</section>`;
    const CA = ((DATA.picks || {}).clv || {}).all;
    h += `<p class="muted" style="margin:-6px 0 0">${CA ? `<b>Line movement on your picks:</b> <span class="${CA.mean_pts > 0 ? 'res-won' : CA.mean_pts < 0 ? 'res-lost' : ''}">${CA.mean_pts >= 0 ? '+' : ''}${CA.mean_pts.toFixed(2)} pts</span> on average; the market moved toward the pick on ${pct(CA.toward)} of ${CA.n} (away on ${pct(CA.away)}). Consistently positive is the best early sign of a real edge.` : 'Line movement on your picks: shows once flagged games have started.'}</p>`;
  }
  {
    const PL = DATA.parlay || {}, T = PL.today, PR = DATA.parlay_rules || {};
    const sgn = v => (v > 0 ? '+' : '') + v;
    let body;
    if (T) {
      const res = T.leg_results || [];

      const late = String(T.note || '').startsWith('late');
      const pill = T.status && T.status !== 'pending' ? `<span class="pill res-${esc(T.status)}">${esc(T.status)} ${T.profit != null ? (T.profit > 0 ? '+' : '') + Number(T.profit).toFixed(2) + 'u' : ''}</span>`
        : late ? '<span class="pill">Late, not counted</span>'
        : PL.locked ? '<span class="pill">Locked</span>' : `<span class="pill">Can change until ${esc((DATA.picks || {}).lock_at || '11:00 AM')}</span>`;
      body = `<div class="top"><h2>Today's parlay · <span class="mono">${sgn(T.price)}</span> at ${esc(T.book)}</h2>${pill}</div>
        <p class="muted" style="margin:0">${T.n_legs} legs · model ${pct(T.p_model, 1)} to hit${T.p_mkt != null ? ` · market ${pct(T.p_mkt, 1)}` : ''} · $10 pays $${(10 * (T.dec - 1)).toFixed(0)}</p>
        <div class="scroll"><table><thead><tr><th>Leg</th><th>Game</th><th>Price</th><th>Model / mkt</th>${res.length ? '<th>Result</th>' : ''}</tr></thead><tbody>
        ${T.legs.map((L, i) => `<tr><td><b>${esc(L.bet)}</b></td><td>${esc(L.game)}</td><td class="mono">${am(L.price)}</td><td>${pct(L.p_model, 1)} / ${L.p_mkt != null ? pct(L.p_mkt, 1) : '–'}</td>${res.length ? `<td>${mark(res[i])}</td>` : ''}</tr>`).join('')}</tbody></table></div>`;
    } else {
      body = `<div class="top"><h2>Today's parlay</h2></div><p class="muted" style="margin:0">No parlay today: fewer than 2 games with prices left.</p>`;
    }
    const A = PL.all;
    body += `<p class="muted" style="margin:0">Parlay record: ${A ? `${A.w}-${A.l}${A.p ? '-' + A.p : ''}, ${A.units >= 0 ? '+' : ''}${A.units.toFixed(2)}u` : 'none graded yet'}. Built from the model's strongest leans, one leg per game, all at one book. Size follows the slate: 2 legs up to 6 games, 3 legs for 7–9, 4 for 10–12, 5 only for 13+. Not a tested edge: every leg adds the book's margin, so keep the stake small.</p>`;
    h += `<section class="picks parlay">${body}</section>`;

  const R = DATA.record || {};
  if (R.n) {

  const PK = DATA.picks || {};
  const rules = PK.rules || {}, mkRules = rules.markets || {};
  const MKN = { totals: 'Totals', ml: 'Moneyline', puck: 'Puck line', reg: 'Regulation (3-way)' };

  const lo = rules.price_min ?? -130, hi = rules.price_max ?? 130;
  const CLV = PK.clv || {};
  const tierBox = (T, key, title, sub) => {
    T = T || {};

    const pctS = v => v == null ? '–' : (v >= 0 ? '+' : '') + (100 * v).toFixed(1) + '%';
    return `<section class="picks ${key}"><div class="top"><h2>${title}</h2><span class="muted">${esc(sub)} · ${T.since ? 'since ' + esc(T.since) : 'starts today'} · 1 unit per pick${PK.excluded ? ' · ' + PK.excluded + ' early picks priced at other books not counted' : ''}</span></div>
      ${A ? `<div class="tiles"><div><span class="muted">Record</span><b class="num">${A.w}-${A.l}${A.p ? '-' + A.p : ''}</b></div>

        <div><span class="muted">Avg EV when flagged</span><b class="num">${T.avg_ev == null ? '–' : (100 * T.avg_ev).toFixed(1) + '%'}</b></div></div>${svg}` : '<p class="muted" style="margin:0">No graded picks yet. Results appear once flagged games go final.</p>'}
      ${clvLine}
      ${T.by_market && Object.keys(T.by_market).length ? `<div class="scroll"><table><thead><tr><th>Market</th><th>Record</th><th>Units</th><th>ROI</th></tr></thead><tbody>${Object.entries(T.by_market).map(([m, r]) => `<tr><td>${esc(MKN[m] || m)}</td><td>${r.w}-${r.l}${r.p ? '-' + r.p : ''}</td><td class="${r.units >= 0 ? 'res-won' : 'res-lost'}">${r.units >= 0 ? '+' : ''}${r.units.toFixed(2)}</td><td>${pctS(r.roi)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${(T.open || []).length ? `<h3>Today</h3><div class="scroll"><table><thead><tr><th>Date</th><th>Pick</th><th>Price</th><th>Book</th><th>Model / mkt</th><th>EV</th><th title="Suggested stake (display only; the record stays 1 unit per pick)">Stake</th><th>Status</th></tr></thead><tbody>${T.open.map(p => row(p, true)).join('')}</tbody></table></div>` : '<p class="muted" style="margin:0">No open picks right now.</p>'}
      ${(T.recent || []).length ? `<details><summary>Graded picks (${T.n})</summary><div class="scroll"><table><thead><tr><th>Date</th><th>Pick</th><th>Price</th><th>Book</th><th>Model / mkt</th><th>EV</th><th>Final</th><th>Result</th></tr></thead><tbody>${T.recent.map(p => row(p, false)).join('')}</tbody></table></div></details>` : ''}
    </section>`;
  };
  const TI = PK.tiers || {};
  const DHx = () => typeof rules.darkhorse === 'object';
  const HF = rules.heavy_fav;
  const mainBox = tierBox(TI.main, 'main', 'Tracked picks', `priced ${lo} to +${hi}${mkRules.ml ? (DHx() ? ', moneyline favourites only' : '') : ''}`);
  h += mainBox;
  if (HF) h += tierBox(TI.heavyfav, 'heavyfav', 'Heavy favourites', `moneyline picks shorter than ${lo} (down to ${HF.shortest}), model ${Math.round(100 * HF.min_gap)}+ pts above the market`);
  const DH = rules.darkhorse;
  if (DH) h += tierBox(TI.darkhorse, 'darkhorse', 'Darkhorse picks', typeof DH === 'object' ? `moneyline underdogs: model ${Math.round(100 * DH.min_gap)}+ pts above the market and ${Math.round(100 * DH.min_model_p)}%+ to win` : 'underdogs');
  h += tierBox(PK.late, 'late', 'Late picks', `any type, first flagged after ${PK.lock_at || '11:00 AM'}; can change until ${PK.late_lock_minutes || 30} min before puck drop, then lock; tracked separately`);
  h += `<p class="unused" style="margin:-10px 0 0">Rules: ${esc(ruleTxt || 'none set')}. Every pick also needs positive EV at the best price; nothing shorter than ${lo} is ever picked. Picks can change until ${esc(PK.lock_at || '11:00 AM')}, then lock at that price; picks first flagged after the lock go to Late picks and lock ${PK.late_lock_minutes || 30} min before their game. Fewer than 300 graded picks per section is mostly noise.</p>`;

  if (!G.length) {
    h += `<div class="empty">No NHL games on this date.</div>`;
  } else {
    h += `<section class="sb scroll"><table><thead><tr><th>Time</th><th>Matchup</th><th>Pick</th><th>Win % model / mkt</th><th>Proj. score</th><th>Total / line</th><th>Over %</th><th>Tracked pick / biggest edge</th><th>Goalies</th></tr></thead><tbody>`;
    G.forEach((g, i) => {
      const m = g.model, mk = g.market || {};
      const homeFav = m.p_home >= .5;
      const pickAb = homeFav ? g.home_ab : g.away_ab, pickP = homeFav ? m.p_home : 1 - m.p_home;
      const mkP = mk.mkt_p_home == null ? null : (homeFav ? mk.mkt_p_home : 1 - mk.mkt_p_home);
      const best = (g.bets || []).slice().sort((a, b) => b.ev - a.ev)[0];
      const flag = (g.bets || []).filter(b => b.flag);

      h += `<tr class="go" tabindex="0" data-i="${i}"><td class="num">${live ? `<span class="pill live">${g.state === 'OFF' || g.state === 'FINAL' ? 'Final ' + g.score_a + '–' + g.score_h : 'Live'}</span>` : time(g.start)}</td>
        <td class="match">${esc(g.away_ab)} @ ${esc(g.home_ab)}</td>
        <td class="pick">${esc(pickAb)} <span class="mono muted">${amP(pickP)}</span></td>
        <td class="num">${pct(pickP)} / ${pct(mkP)}</td>

        <td class="num">${f2(m.exp_total)} / ${mk.tot_line ?? '–'}</td>
        <td class="num">${pct(g.p_over_line)} / ${pct(mk.mkt_p_over)}</td>
        <td class="pk">${flag.length ? flag.map(b => `<span class="pill ${TCLS[b.tier]}">${TTAG[b.tier]} ${esc(b.bet)} ${am(b.price)}</span>`).join(' ') : best ? `<span class="pill ${best.ev > 0 ? 'pos' : 'neg'}">${esc(best.bet)} ${am(best.price)} · EV ${(best.ev * 100).toFixed(1)}%</span>` : '<span class="muted">no odds</span>'}</td>
        <td>${statusPill(g.goalies.a.status)} ${statusPill(g.goalies.h.status)}</td></tr>`;
    });
    h += `</tbody></table></section><section class="games">`;

    G.forEach((g, i) => {
      const m = g.model, mk = g.market || {};
      const ctxH = g.ctx.h, ctxA = g.ctx.a, sh = g.schedule.h, sa = g.schedule.a;
      const gH = g.goalies.h, gA = g.goalies.a;
      const gflag = (g.bets || []).filter(b => b.flag);
      h += `<article class="game${gflag.some(b => b.tier !== 'darkhorse') ? ' has-pick' : ''}" id="g${i}">
        <div class="ghead"><div class="team"><div class="ab">${esc(g.away_ab)}</div><div class="nm">${esc(g.away)}${ctxA.standing?.record ? ' · ' + esc(ctxA.standing.record) : ''}</div></div>
          <div class="mid"><span class="lab">Projected</span><span class="proj num">${f1(m.exp_a)}–${f1(m.exp_h)}</span><span class="lab">${time(g.start)}</span></div>
          <div class="team home"><div class="ab">${esc(g.home_ab)}</div><div class="nm">${esc(g.home)}${ctxH.standing?.record ? ' · ' + esc(ctxH.standing.record) : ''}</div></div></div>
        <div class="bar">
          <div class="row"><span class="num">${pct(1 - m.p_home)}</span><div class="track"><div class="fill" style="width:${100 * (1 - m.p_home)}%;background:var(--blue)"></div><div class="mid50"></div></div><span class="num">${pct(m.p_home)}</span></div>
          ${mk.mkt_p_home != null ? `<div class="row"><span class="num">${pct(1 - mk.mkt_p_home)}</span><div class="track"><div class="fill" style="width:${100 * (1 - mk.mkt_p_home)}%;background:var(--red)"></div><div class="mid50"></div></div><span class="num">${pct(mk.mkt_p_home)}</span></div>` : ''}
        </div>
        <div class="facts"><span>Total <b class="num">${f2(m.exp_total)}</b>${mk.tot_line != null ? ` vs line <b>${mk.tot_line}</b> · over <b>${pct(g.p_over_line)}</b> (mkt ${pct(mk.mkt_p_over)})` : ''}</span>
          <span>Regulation <b class="num">${esc(g.away_ab)} ${pct(m.p_reg_away)} · OT ${pct(m.p_ot)} · ${esc(g.home_ab)} ${pct(m.p_reg_home)}</b>${mk.mkt_p_reg_d != null ? ` <span class="muted">(mkt ${pct(mk.mkt_p_reg_a)} · ${pct(mk.mkt_p_reg_d)} · ${pct(mk.mkt_p_reg_h)})</span>` : ''}</span>
          ${gflag.map(b => `<span class="pill ${TCLS[b.tier]}">${TNAME[b.tier]}: ${esc(b.bet)} ${am(b.price)} at ${esc(b.book)}</span>`).join('')}
          <span>Fair ML <b class="mono">${esc(g.away_ab)} ${esc(g.fair_ml_a)} / ${esc(g.home_ab)} ${esc(g.fair_ml_h)}</b></span></div>
        ${(g.writeup || []).length ? `<div class="wu">${g.writeup.map(x => `<p${x.startsWith('\u2192') ? ' class="wu-pick"' : x.startsWith('No pick') ? ' class="wu-none"' : ''}>${esc(x)}</p>`).join('')}</div>` : ''}
        <div class="body">
          <div class="panel"><h3>Most likely final scores</h3>
            <div class="scores">${(m.top_scores || []).map(([hs, as, p]) => `<span><b>${esc(g.away_ab)} ${as}–${hs} ${esc(g.home_ab)}</b>${pct(p, 1)}</span>`).join('')}</div>
            <h3>What moves this game <span style="text-transform:none;letter-spacing:0;font-weight:400">(expected goals)</span></h3>
            <div class="drv">${g.drivers.length ? g.drivers.map(d => `<div><span>${esc(d.team)} · ${esc(d.what)}</span><b class="${d.goals > 0 ? 'ev-pos' : 'ev-neg'}" style="white-space:nowrap">${d.goals > 0 ? '+' : ''}${d.goals.toFixed(2)} g</b></div>`).join('') : '<span class="muted">No adjustment beyond team ratings and home ice.</span>'}</div>
          </div>
          <div class="panel wide"><h3>Model vs best available price</h3>
            ${g.bets.length ? `<div class="scroll"><table class="bets"><thead><tr><th>Bet</th><th>Best price</th><th>Model</th><th>Mkt</th><th title="Model minus market, in percentage points">Edge</th><th>EV</th></tr></thead><tbody>
              ${g.bets.map(b => `<tr${b.flag ? ' class="flagged"' : ''}><td>${esc(b.bet)}${b.flag ? ` <span class="pill ${TCLS[b.tier]}">${TTAG[b.tier]}</span>` : ''}</td><td><span class="mono">${am(b.price)}</span><br><span class="bk">${esc(b.book)}</span></td><td>${pct(b.p_model, 1)}</td><td>${pct(b.p_mkt, 1)}</td><td class="${b.gap > 0 ? 'ev-pos' : 'ev-neg'}">${b.gap == null ? '–' : (b.gap > 0 ? '+' : '') + (100 * b.gap).toFixed(1)}</td><td class="${b.ev > 0 ? 'ev-pos' : 'ev-neg'}">${(b.ev * 100).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>` : '<span class="muted">No odds posted yet.</span>'}
          </div>
          <div class="panel"><h3>Starting goalies</h3>
            <div class="kv"><span class="h">&nbsp;</span><span class="h">Season GSAx</span><span class="h">Last ${gA.n_l10 ?? 10} GSAx</span>
              <span>${esc(g.away_ab)} · ${esc(gA.name)} ${statusPill(gA.status)}</span><span>${gA.gsax_season ?? '–'} <span class="muted">(${gA.gp_season ?? 0} GP)</span></span><span>${gA.gsax_l10 ?? '–'}</span>
              <span>${esc(g.home_ab)} · ${esc(gH.name)} ${statusPill(gH.status)}</span><span>${gH.gsax_season ?? '–'} <span class="muted">(${gH.gp_season ?? 0} GP)</span></span><span>${gH.gsax_l10 ?? '–'}</span></div>
            <span class="unused">Goals saved above expected (MoneyPuck xG). Long-run GSAx drives the model; last-10 is shown for context only.</span>
          </div>
        </div>
        <details><summary>Odds by book, team context, head-to-head</summary>
          <div class="body">
            <div class="panel" style="grid-column:1/-1"><h3>Every book</h3>
              ${g.books.length ? `<div class="scroll"><table class="odds"><thead><tr><th>Book</th><th>${esc(g.away_ab)} ML</th><th>${esc(g.home_ab)} ML</th><th>${esc(g.away_ab)} PL</th><th>${esc(g.home_ab)} PL</th><th>Total</th><th>Over</th><th>Under</th>${g.books.some(b => b.rg_h != null) ? `<th>${esc(g.away_ab)} reg</th><th>Reg tie</th><th>${esc(g.home_ab)} reg</th>` : ''}</tr></thead><tbody>
              ${g.books.map(b => { const best = (k, v) => mk[k] && mk[k].price === v ? ' class="best mono"' : ' class="mono"';
                return `<tr><td>${esc(b.book)}</td><td${best('best_ml_a', b.ml_a)}>${am(b.ml_a)}</td><td${best('best_ml_h', b.ml_h)}>${am(b.ml_h)}</td>
                <td class="mono">${b.pl_a_pt != null ? (b.pl_a_pt > 0 ? '+' : '') + b.pl_a_pt + ' ' + am(b.pl_a) : '–'}</td><td class="mono">${b.pl_h_pt != null ? (b.pl_h_pt > 0 ? '+' : '') + b.pl_h_pt + ' ' + am(b.pl_h) : '–'}</td>
                <td class="mono">${b.tot_pt ?? '–'}</td><td${b.tot_pt === mk.tot_line ? best('best_over', b.tot_o) : ' class="mono"'}>${am(b.tot_o)}</td><td${b.tot_pt === mk.tot_line ? best('best_under', b.tot_u) : ' class="mono"'}>${am(b.tot_u)}</td>
                ${g.books.some(x => x.rg_h != null) ? `<td${best('best_rg_a', b.rg_a)}>${am(b.rg_a)}</td><td${best('best_rg_d', b.rg_d)}>${am(b.rg_d)}</td><td${best('best_rg_h', b.rg_h)}>${am(b.rg_h)}</td>` : ''}</tr>`; }).join('')}
              </tbody></table></div><span class="unused">Green is the best price for that side at your books (${esc(((DATA.picks || {}).rules || {}).my_books ? DATA.picks.rules.my_books.join(', ') : 'all books')}). Picks, EV and the record use those prices only.</span>` : '<span class="muted">No odds posted yet.</span>'}
            </div>
            <div class="panel"><h3>Team context</h3>
              <div class="ctx"><span></span><span class="h">${esc(g.away_ab)}</span><span class="h">${esc(g.home_ab)}</span>
                <span>Last 10</span><span>${esc(ctxA.standing?.l10 ?? '–')} ${esc(ctxA.standing?.streak ?? '')}</span><span>${esc(ctxH.standing?.l10 ?? '–')} ${esc(ctxH.standing?.streak ?? '')}</span>
                <span>Road / home</span><span>${esc(ctxA.standing?.road_rec ?? '–')} road</span><span>${esc(ctxH.standing?.home_rec ?? '–')} home</span>
                <span>xG share, last 10</span><span>${pct(ctxA.xg_pct_l10, 1)}</span><span>${pct(ctxH.xg_pct_l10, 1)}</span>
                <span>xGF / xGA per game</span><span>${f2(ctxA.xgf_season)} / ${f2(ctxA.xga_season)}</span><span>${f2(ctxH.xgf_season)} / ${f2(ctxH.xga_season)}</span>
                <span>PP xG per game</span><span>${f2(ctxA.pp_xg)}</span><span>${f2(ctxH.pp_xg)}</span>
                <span>PK xG against</span><span>${f2(ctxA.pk_xga)}</span><span>${f2(ctxH.pk_xga)}</span>
                <span>Rest days</span><span>${sa.rest ?? '–'}${sa.b2b ? ' · B2B' : ''}</span><span>${sh.rest ?? '–'}${sh.b2b ? ' · B2B' : ''}</span>
                <span>Travel since last game</span><span>${Math.round(sa.travel_km || 0).toLocaleString()} km${sa.tz_shift ? ' · ' + sa.tz_shift + ' TZ' : ''}</span><span>${Math.round(sh.travel_km || 0).toLocaleString()} km${sh.tz_shift ? ' · ' + sh.tz_shift + ' TZ' : ''}</span>
                ${g.injury_model ? `<span>Out (injury report)</span><span>${(g.out.a || []).map(o => esc(o.name) + (o.status.toLowerCase().includes('day') ? ' (DTD)' : '')).join(', ') || '–'}</span><span>${(g.out.h || []).map(o => esc(o.name) + (o.status.toLowerCase().includes('day') ? ' (DTD)' : '')).join(', ') || '–'}</span>` : ''}
                <span>Finishing, last 20 (G − xG)</span><span>${f2(ctxA.fin_l20)}</span><span>${f2(ctxH.fin_l20)}</span>
              </div>
              <span class="unused">Rest beyond back-to-backs, travel, altitude and finishing luck are shown for context; they did not improve the backtest, so the model ignores them.</span>
            </div>
            <div class="panel"><h3>Hot scorers, last 10 games</h3>
              ${[['a', ctxA], ['h', ctxH]].map(([s, c]) => `<div class="drv"><b>${esc(s === 'a' ? g.away_ab : g.home_ab)}</b>${(c.hot || []).map(p => `<div><span>${esc(p.name)}</span><span class="num">${p.goals} G · ${p.xg} xG · ${p.shots} att</span></div>`).join('') || '<span class="muted">–</span>'}</div>`).join('')}
              <h3>Recent meetings</h3>
              <div class="drv">${g.h2h.length ? g.h2h.map(m2 => `<div><span>${esc(m2.date)}</span><span class="num">${esc(m2.away)} @ ${esc(m2.home)} · ${esc(m2.score)}</span></div>`).join('') : '<span class="muted">None in the last two seasons.</span>'}</div>
              <span class="unused">Scorer streaks and head-to-head are context only; neither predicted results in the backtest.</span>
            </div>
          </div>
        </details>
      </article>`;
    });
    h += `</section>`;
  }

  const B = DATA.backtest || {};
  const lab = { base: 'Ratings + home + back-to-back', goalie: '+ goalie GSAx (v2)', special: 'v2 + special teams', schedule: 'v2 + rest/travel/altitude', form: 'v2 + last-10 form', finishing: 'v2 + finishing luck', hotgoalie: 'v2 + hot goalie (last 10)', h2h: 'v2 + head-to-head', FINAL: 'Model in use' };
  h += `<section class="method"><h2>How it works</h2>
    <p>Each team gets attack and defence ratings from recency-weighted expected goals (MoneyPuck shot data, regulation, empty nets removed). A per-side Poisson model turns those into expected goals, adjusted for the inputs that earned a place in testing: <b>${(DATA.groups || []).join(', ')}</b>, plus home ice and back-to-backs.${(DATA.extras || []).length ? ` Also live: <b>${DATA.extras.map(esc).join(', ')}</b>.` : ''} Empty-net goals and overtime are simulated on top, which gives the win %, puck line, every total and the exact-score odds from one distribution.</p>
    ${B.FINAL ? `<div class="scroll"><table><thead><tr><th>Backtest, ${B.FINAL.n_ml.toLocaleString()} games since Oct 2021</th><th>ML log-loss</th><th>Totals log-loss</th><th>Picks right</th></tr></thead><tbody>
      <tr><td>Closing market</td><td>${B.base.ml_mkt.toFixed(4)}</td><td>${B.base.tot_mkt.toFixed(4)}</td><td>${pct(B.base.mkt_pick_acc, 1)}</td></tr>
      ${Object.keys(lab).filter(k => B[k]).map(k => `<tr><td>${k === 'FINAL' ? '<b>' + lab[k] + '</b>' : lab[k]}</td><td>${B[k].ml.toFixed(4)}</td><td>${B[k].tot.toFixed(4)}</td><td>${pct(B[k].pick_acc, 1)}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
    <p class="muted">Lower log-loss is better; a coin flip scores 0.6931. Injuries and line combinations are not in the data yet, so a late scratch of a star is not reflected. The goalie projection comes from DailyFaceoff; “Model guess” means no projection was posted and the team's most-used recent starter was assumed.</p>
  </section>`;

  app.innerHTML = h;
  app.querySelectorAll('tr.go').forEach(tr => {
    const go = () => document.getElementById('g' + tr.dataset.i).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
})();
</script>

</body></html>
